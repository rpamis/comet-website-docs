<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Native Shape</title>
  <desc id="desc">Agent 调查仓库后，通过 Batch 或 Sequential 澄清路径收束为明确目标。</desc>
  <defs>
    <marker id="shape-arrow" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 26 14 2 26Z" fill="#0063F8" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF" />

  <g fill="none" stroke="#0063F8" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M360 450H520" marker-end="url(#shape-arrow)" />
    <path d="M548 450C650 450 650 270 770 270" />
    <path d="M548 450C650 450 650 630 770 630" />
    <path d="M1005 270C1118 270 1110 450 1215 450" />
    <path d="M1005 630C1118 630 1110 450 1215 450" />
    <path d="M1215 450H1320" marker-end="url(#shape-arrow)" />
  </g>

  <g font-family="Inter, Noto Sans SC, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(250 420)">
      <circle r="104" fill="none" stroke="#0063F8" stroke-width="28" />
      <path d="M74 74 135 135" stroke="#0063F8" stroke-width="34" stroke-linecap="round" />
      <text y="190" fill="#07164A" font-size="42">Investigate</text>
    </g>

    <g transform="translate(870 270)">
      <circle cx="-84" r="34" fill="#0063F8" />
      <circle r="34" fill="#0063F8" />
      <circle cx="84" r="34" fill="#0063F8" />
      <text y="-86" fill="#07164A" font-size="44">Batch</text>
    </g>

    <g transform="translate(870 630)">
      <circle cx="-84" r="31" fill="#0063F8" />
      <circle r="31" fill="#0063F8" />
      <circle cx="84" r="31" fill="#0063F8" />
      <path d="M-48 0H-34M34 0H48" stroke="#07164A" stroke-width="12" stroke-linecap="round" />
      <text y="112" fill="#07164A" font-size="44">Sequential</text>
    </g>

    <g transform="translate(1415 450)">
      <circle r="112" fill="#0063F8" />
      <circle r="68" fill="#FFFFFF" />
      <circle r="32" fill="#0063F8" />
      <circle cx="82" cy="82" r="30" fill="#65B800" />
      <path d="m67 82 11 12 22-28" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      <text y="188" fill="#07164A" font-size="44">Goal</text>
    </g>
  </g>
</svg>
