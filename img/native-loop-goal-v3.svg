<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Native Loop</title>
  <desc id="desc">Shape、Build、Verify、Archive 四个阶段围绕 Runtime 循环推进，验证失败时返回 Build。</desc>
  <defs>
    <marker id="blue-arrow" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 26 14 2 26Z" fill="#0063F8" />
    </marker>
    <marker id="coral-arrow" markerWidth="28" markerHeight="28" refX="24" refY="14" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2 2 26 14 2 26Z" fill="#FF6B55" />
    </marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF" />

  <g fill="none" stroke="#0063F8" stroke-width="22" stroke-linecap="round" marker-end="url(#blue-arrow)">
    <path d="M418 330 Q560 150 685 158" />
    <path d="M918 158 Q1088 168 1190 330" />
    <path d="M1230 548 Q1100 726 920 730" />
    <path d="M676 730 Q500 710 390 552" />
  </g>

  <g font-family="Inter, Noto Sans SC, Arial, sans-serif" text-anchor="middle" font-weight="700">
    <g transform="translate(800 160)">
      <circle r="112" fill="#0063F8" />
      <path d="M-30-35 38-35 38-22-30-22ZM-30-8 24-8 24 5-30 5ZM-30 19 12 19 12 32-30 32Z" fill="#FFFFFF" />
      <text y="76" fill="#FFFFFF" font-size="38">Shape</text>
    </g>

    <g transform="translate(1260 440)">
      <rect x="-112" y="-105" width="224" height="210" rx="48" fill="#0063F8" />
      <path d="m0-56 54 29v58L0 60l-54-29v-58Zm0 14-31 17L0-8l31-17Zm-38 28v37L-8 39V2Zm76 0L8 2v37l30-16Z" fill="#FFFFFF" />
      <text y="76" fill="#FFFFFF" font-size="38">Build</text>
    </g>

    <g transform="translate(800 730)">
      <rect x="-90" y="-90" width="180" height="180" rx="42" transform="rotate(45)" fill="#0063F8" />
      <path d="M0-57 52-39v39c0 34-21 61-52 75C-31 61-52 34-52 0v-39Zm-25 56 18 18 35-39 13 12-47 53-32-32Z" fill="#FFFFFF" transform="translate(0 -24) scale(.72)" />
      <text y="76" fill="#FFFFFF" font-size="38">Verify</text>
    </g>

    <g transform="translate(340 440)">
      <circle r="112" fill="#0063F8" />
      <path d="M-48-35h96v18h-96Zm8 29h80v66h-80Zm23 18h34v12h-34Z" fill="#FFFFFF" />
      <text y="76" fill="#FFFFFF" font-size="38">Archive</text>
    </g>

    <g transform="translate(800 440)">
      <circle r="116" fill="#07164A" />
      <circle r="24" fill="#FFFFFF" />
      <g fill="#FFFFFF">
        <circle cx="0" cy="-58" r="14" />
        <circle cx="55" cy="-18" r="14" />
        <circle cx="34" cy="48" r="14" />
        <circle cx="-34" cy="48" r="14" />
        <circle cx="-55" cy="-18" r="14" />
      </g>
      <g stroke="#FFFFFF" stroke-width="10">
        <path d="M0-24V-44M22-8l22-8M14 20l14 18M-14 20l-14 18M-22-8l-22-8" />
      </g>
      <text y="82" fill="#FFFFFF" font-size="34">Runtime</text>
    </g>
  </g>

  <path d="M990 650 Q1098 548 1148 474" fill="none" stroke="#FF6B55" stroke-width="18" stroke-linecap="round" marker-end="url(#coral-arrow)" />
  <circle cx="930" cy="792" r="18" fill="#65B800" />
</svg>
