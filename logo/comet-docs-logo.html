<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Comet Docs</title>
<!--
  Source: renders to logo/comet-docs-logo.png (865x289).
  Font (Source Serif 4, weight 600) is base64-inlined at render time so the
  headless screenshot captures the real glyph shapes instead of a fallback.
  Hero title typography reused from custom.css (.comet-home__hero h1):
  weight 600, letter-spacing -0.035em, ink color #14161c.
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 865px; height: 289px; }

  body {
    background: #ffffff;
    display: flex;
    align-items: center;     /* vertically center within 289px */
    justify-content: center; /* horizontally center within 865px */
  }

  .row {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .logo {
    /* 90% of full-fill height (254 -> 229): leaves a small margin on all sides. */
    height: 229px;
    width: auto;
    display: block;
    user-select: none;
    -webkit-user-drag: none;
    /* The star glyph sits off-center inside the 500x500 png (content center is
       +17px right, +6px down vs the box center). Shift the box left/up so the
       visible glyph aligns with the text's optical center. */
    transform: translate(-7.8px, -2.8px);
  }

  .text {
    /* Hero title typography from custom.css (.comet-home__hero h1) */
    font-family: "Source Serif 4", ui-serif, Georgia, serif;
    font-weight: 600;
    font-size: 99px;          /* 90% of 110 */
    line-height: 1;
    letter-spacing: -0.035em;
    color: #14161c;           /* --ink */
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="row">
    <img class="logo" src="favicon.png" alt="Comet logo" />
    <span class="text">Comet Docs</span>
  </div>
</body>
</html>
